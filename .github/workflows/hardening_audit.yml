---
name: "devsec.hardening_audit"
on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'plugins/modules/hardening_audit.py'
      - 'roles/hardening_audit/**'
      - 'roles/*/vars/audit.yml'
      - 'molecule/hardening_audit/**'
      - '.github/workflows/hardening_audit.yml'
      - 'requirements.txt'
  pull_request:
    branches: [master]
    paths:
      - 'plugins/modules/hardening_audit.py'
      - 'roles/hardening_audit/**'
      - 'roles/*/vars/audit.yml'
      - 'molecule/hardening_audit/**'
      - '.github/workflows/hardening_audit.yml'
      - 'requirements.txt'
  schedule:
    - cron: '0 7 * * 3'

concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event.pull_request.number || github.sha
    }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    env:
      PY_COLORS: 1
      ANSIBLE_FORCE_COLOR: 1
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: ansible_collections/devsec/hardening
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: 3.14
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: ansible_collections/devsec/hardening

      - name: Test three distributions
        run: molecule test -s hardening_audit
        working-directory: ansible_collections/devsec/hardening
